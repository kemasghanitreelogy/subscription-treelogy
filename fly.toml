# fly.toml app configuration file generated for treelogy-subscriptions on 2026-07-27T11:32:17+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'treelogy-subscriptions'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[processes]
  web = 'npm run docker-start'
  worker = 'npm run worker'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['web']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['worker']
